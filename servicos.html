<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Serviços | Harmonia Academy</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html"><strong>Serviços</strong></a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta</a>
        <a href="inscricoes.html">Inscrições</a>
        <a href="login.html">Login</a>
    </nav>
    <header class="banner">
        <h1>Cadastro de Serviços</h1>
        <p>Catálogo de aulas e serviços</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>Novo serviço</h2>
            <form action="/salvar-servico" method="POST">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" required>
                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" name="preco" step="0.01" min="0" required>
                <label for="tempo_estimado">Tempo estimado (min)</label>
                <input type="number" id="tempo_estimado" name="tempo_estimado" min="1" required>
                <button type="submit">Salvar</button>
            </form>
        </div>
        <div class="card">
            <h2>Lista de serviços</h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Descrição</th><th>Preço</th><th>Tempo (min)</th></tr>
                    </thead>
                    <tbody id="lista-servicos"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }
        fetch('/listar-servicos', { credentials: 'same-origin' })
            .then(r => {
                if (r.status === 401) { window.location.href = '/login.html?next=/servicos.html'; return null; }
                return r.json();
            })
            .then(rows => {
                if (!rows) return;
                const tbody = document.getElementById('lista-servicos');
                if (!rows.length) {
                    tbody.innerHTML = '<tr><td colspan="4">Nenhum serviço cadastrado.</td></tr>';
                    return;
                }
                tbody.innerHTML = rows.map(s =>
                    `<tr><td>${s.id}</td><td>${escapeHtml(s.descricao)}</td><td>R$ ${Number(s.preco).toFixed(2)}</td><td>${s.tempo_estimado}</td></tr>`
                ).join('');
            })
            .catch(() => {
                document.getElementById('lista-servicos').innerHTML =
                    '<tr><td colspan="4">Inicie o servidor (npm start) e faça login.</td></tr>';
            });
    </script>
</body>
</html>
