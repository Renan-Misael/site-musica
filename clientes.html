<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Clientes | Harmonia Academy</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="clientes.html"><strong>Clientes</strong></a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="consulta_agendamentos.html">Consulta</a>
        <a href="inscricoes.html">Inscrições</a>
        <a href="login.html">Login</a>
    </nav>
    <header class="banner">
        <h1>Cadastro de Clientes</h1>
        <p>Gerencie os clientes da Harmonia Academy</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>Novo cliente</h2>
            <form action="/salvar-cliente" method="POST">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required>
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" required>
                <button type="submit">Salvar</button>
            </form>
        </div>
        <div class="card">
            <h2>Lista de clientes</h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Nome</th><th>CPF</th><th>Telefone</th></tr>
                    </thead>
                    <tbody id="lista-clientes"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }
        fetch('/listar-clientes', { credentials: 'same-origin' })
            .then(r => {
                if (r.status === 401) { window.location.href = '/login.html?next=/clientes.html'; return null; }
                return r.json();
            })
            .then(rows => {
                if (!rows) return;
                const tbody = document.getElementById('lista-clientes');
                if (!rows.length) {
                    tbody.innerHTML = '<tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>';
                    return;
                }
                tbody.innerHTML = rows.map(c =>
                    `<tr><td>${c.id}</td><td>${escapeHtml(c.nome)}</td><td>${escapeHtml(c.cpf)}</td><td>${escapeHtml(c.telefone)}</td></tr>`
                ).join('');
            })
            .catch(() => {
                document.getElementById('lista-clientes').innerHTML =
                    '<tr><td colspan="4">Inicie o servidor (npm start) e faça login.</td></tr>';
            });
    </script>
</body>
</html>
